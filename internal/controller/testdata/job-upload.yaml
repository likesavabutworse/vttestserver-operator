metadata:
  labels:
    vttestserver-operator.io/snapshot: golden-1
  name: golden-1-upload
  namespace: ns
spec:
  activeDeadlineSeconds: 1800
  backoffLimit: 0
  template:
    metadata:
      labels:
        vttestserver-operator.io/snapshot: golden-1
    spec:
      containers:
      - args:
        - snapshot
        - --data-dir
        - /vt/vtdataroot
        - --name
        - golden-1
        - --bucket
        - bkt
        - --prefix
        - pre
        - --endpoint
        - http://silo:9000
        - --force-path-style
        - --tag
        - latest
        - --keyspace
        - commerce:1
        - --keyspace
        - customer:10
        command:
        - /datactl
        image: datactl:test
        name: datactl
        resources:
          limits:
            memory: 256Mi
          requests:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /vt/vtdataroot
          name: data
      restartPolicy: Never
      securityContext:
        fsGroup: 999
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: snapshots
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data-shop-0
status: {}

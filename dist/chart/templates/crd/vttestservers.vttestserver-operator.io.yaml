{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: vttestservers.vttestserver-operator.io
spec:
  group: vttestserver-operator.io
  names:
    kind: VTTestServer
    listKind: VTTestServerList
    plural: vttestservers
    singular: vttestserver
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.endpoints.mysql
      name: MySQL
      type: string
    - jsonPath: .status.restoredFrom.name
      name: Restored
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: VTTestServer is one ephemeral vttestserver instance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of VTTestServer
            properties:
              allowVSchemaDDL:
                description: allowVSchemaDDL turns on ALTER VSCHEMA. A later apply
                  of spec.vschema overwrites such changes.
                type: boolean
              extraArgs:
                description: extraArgs are added at the end of the vttestserver command
                  line.
                items:
                  type: string
                type: array
              image:
                description: image is the vttestserver image. Pin it by digest. The
                  official vitess/vttestserver image works.
                minLength: 1
                type: string
              initSQL:
                description: initSQL is an ordered list of SQL files. The operator
                  runs them after the VSchema.
                items:
                  description: InitSQLSource is one SQL file that the operator runs
                    in a keyspace.
                  properties:
                    configMapKeyRef:
                      description: configMapKeyRef points at the SQL text. The statements
                        must be idempotent.
                      properties:
                        key:
                          description: key is the key inside the ConfigMap.
                          minLength: 1
                          type: string
                        name:
                          description: name is the ConfigMap name.
                          minLength: 1
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    keyspace:
                      description: keyspace is where the statements run. It must be
                        one of spec.keyspaces.
                      maxLength: 63
                      minLength: 1
                      type: string
                  required:
                  - configMapKeyRef
                  - keyspace
                  type: object
                maxItems: 64
                type: array
              keyspaces:
                description: keyspaces lists the keyspaces and their shard counts.
                  It cannot change after creation.
                items:
                  description: KeyspaceSpec is one keyspace of the server.
                  properties:
                    name:
                      description: name is the keyspace name.
                      maxLength: 63
                      pattern: ^[a-zA-Z][a-zA-Z0-9_]*$
                      type: string
                    shards:
                      default: 1
                      description: shards is the shard count. It is the vttestserver
                        --num-shards flag, not part of the VSchema.
                      format: int32
                      maximum: 256
                      minimum: 1
                      type: integer
                  required:
                  - name
                  - shards
                  type: object
                maxItems: 32
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: keyspaces is immutable
                  rule: self == oldSelf
              mysqlConfig:
                additionalProperties:
                  type: string
                description: 'mysqlConfig adds my.cnf settings, for example innodb_buffer_pool_size:
                  256M.'
                type: object
              resources:
                description: resources are the container resources of vttestserver.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              restoreFrom:
                description: restoreFrom restores a snapshot into an empty data volume,
                  once. It cannot change after creation.
                properties:
                  name:
                    description: name is the snapshot name.
                    type: string
                  s3:
                    description: s3 is the snapshot store.
                    properties:
                      bucket:
                        description: bucket is the bucket name.
                        minLength: 1
                        type: string
                      credentialsSecretRef:
                        description: |-
                          credentialsSecretRef names a Secret with AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and
                          optional AWS_SESSION_TOKEN. Leave it empty to use IRSA or Pod Identity through serviceAccountName.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      endpoint:
                        description: endpoint is the URL of S3 compatible storage,
                          for example in-cluster Silo or MinIO.
                        type: string
                      forcePathStyle:
                        description: forcePathStyle turns on path style addressing,
                          which most S3 compatible storage needs.
                        type: boolean
                      prefix:
                        description: prefix is the key prefix inside the bucket.
                        type: string
                      region:
                        description: region is the AWS region.
                        type: string
                    required:
                    - bucket
                    type: object
                  tag:
                    description: tag is a tag such as latest. The first restore pins
                      the snapshot that the tag points to.
                    type: string
                required:
                - s3
                type: object
                x-kubernetes-validations:
                - message: set exactly one of name and tag
                  rule: has(self.name) != has(self.tag)
              serviceAccountName:
                description: serviceAccountName is used by the pod. A restore with
                  IRSA or Pod Identity needs it.
                type: string
              storage:
                description: storage is the data volume. The default is an emptyDir.
                properties:
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    description: size is the PVC size. It is used only for persistent
                      storage.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  storageClassName:
                    description: storageClassName is the storage class of the PVC.
                      The cluster default is used when empty.
                    type: string
                  type:
                    default: ephemeral
                    description: type is persistent (a PVC, needed as a snapshot source)
                      or ephemeral (an emptyDir).
                    enum:
                    - persistent
                    - ephemeral
                    type: string
                type: object
              vschema:
                description: vschema is the ConfigMap with the VSchema JSON per keyspace.
                properties:
                  configMapRef:
                    description: configMapRef names a ConfigMap with the keys <keyspace>.json.
                      A keyspace without a key gets no VSchema.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                required:
                - configMapRef
                type: object
            required:
            - image
            - keyspaces
            type: object
            x-kubernetes-validations:
            - message: restoreFrom is immutable
              rule: has(self.restoreFrom) == has(oldSelf.restoreFrom) && (!has(self.restoreFrom)
                || self.restoreFrom == oldSelf.restoreFrom)
            - message: a keyspace with more than one shard needs spec.vschema or spec.restoreFrom
              rule: self.keyspaces.all(k, k.shards == 1) || has(self.vschema) || has(self.restoreFrom)
            - message: initSQL keyspace must be one of spec.keyspaces
              rule: '!has(self.initSQL) || self.initSQL.all(s, self.keyspaces.exists(k,
                k.name == s.keyspace))'
          status:
            description: status defines the observed state of VTTestServer
            properties:
              appliedPodUID:
                description: appliedPodUID is the pod that the VSchema and init SQL
                  were applied to. A new pod gets them again.
                type: string
              conditions:
                description: conditions are Restored, VSchemaApplied, InitSQLApplied
                  and Ready.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoints:
                description: endpoints are the in-cluster addresses.
                properties:
                  grpc:
                    description: grpc is the <name>.<namespace>.svc:<port> address
                      of the vtctld gRPC port.
                    type: string
                  mysql:
                    description: mysql is the <name>.<namespace>.svc:<port> address
                      of the vtgate MySQL port.
                    type: string
                type: object
              initSQL:
                description: initSQL records the applied init SQL hash.
                properties:
                  appliedAt:
                    description: appliedAt is when it was applied.
                    format: date-time
                    type: string
                  appliedHash:
                    description: appliedHash is a hash of the VSchema or init SQL
                      that was last applied.
                    type: string
                type: object
              observedGeneration:
                description: observedGeneration is the spec generation that the status
                  describes.
                format: int64
                type: integer
              phase:
                description: phase is the lifecycle phase.
                type: string
              restoredFrom:
                description: restoredFrom is the snapshot that the restore pinned.
                properties:
                  name:
                    description: name is the snapshot name, resolved from spec.restoreFrom.tag
                      or .name.
                    type: string
                  resolvedAt:
                    description: resolvedAt is when the restore finished.
                    format: date-time
                    type: string
                  sha256:
                    description: sha256 is the digest of the restored archive.
                    type: string
                required:
                - name
                type: object
              vschema:
                description: vschema records the applied VSchema hash.
                properties:
                  appliedAt:
                    description: appliedAt is when it was applied.
                    format: date-time
                    type: string
                  appliedHash:
                    description: appliedHash is a hash of the VSchema or init SQL
                      that was last applied.
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}

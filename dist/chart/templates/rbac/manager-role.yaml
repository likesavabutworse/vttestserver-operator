{{- if .Values.rbac.namespaced }}
{{- range $ns := splitList "," (include "vttestserver-operator.watchNamespaces" .) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{ $ns }}
  name: {{ include "vttestserver-operator.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - vttestserver-operator.io
  resources:
  - vttestservers
  - vttestserversnapshots
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - vttestserver-operator.io
  resources:
  - vttestservers/finalizers
  - vttestserversnapshots/finalizers
  verbs:
  - update
- apiGroups:
  - vttestserver-operator.io
  resources:
  - vttestservers/status
  - vttestserversnapshots/status
  verbs:
  - get
  - patch
  - update
{{- end }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vttestserver-operator.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - vttestserver-operator.io
  resources:
  - vttestservers
  - vttestserversnapshots
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - vttestserver-operator.io
  resources:
  - vttestservers/finalizers
  - vttestserversnapshots/finalizers
  verbs:
  - update
- apiGroups:
  - vttestserver-operator.io
  resources:
  - vttestservers/status
  - vttestserversnapshots/status
  verbs:
  - get
  - patch
  - update
{{- end }}

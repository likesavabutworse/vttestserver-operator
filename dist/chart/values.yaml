## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Configure the controller manager deployment
##
manager:
  ## Set to false to skip manager installation
  ##
  enabled: true

  ## Two replicas with leader election: one works, one takes over when it stops. Running servers do not
  ## depend on the operator.
  ##
  replicas: 2

  ## Namespaces to watch (templates allowed). Empty means all namespaces, or only the release namespace
  ## when rbac.namespaced is true. With rbac.namespaced, the chart creates a Role and RoleBinding in each of them.
  ##
  watchNamespaces: []
  # watchNamespaces: ["pr-env-1", "{{ .Release.Namespace }}"]

  image:
    repository: ghcr.io/likesavabutworse/vttestserver-operator
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    # tag: ""
    pullPolicy: IfNotPresent

  ## Arguments
  ##
  ## The chart sets the metrics, health probe, datactl image and watch namespaces flags. Other flags:
  ## --max-concurrent-reconciles (3), --leader-election-lease-duration (15s),
  ## --leader-election-renew-deadline (10s), --leader-election-retry-period (2s),
  ## --snapshot-quiesce-timeout (10m), --snapshot-upload-timeout (30m), --zap-devel, --zap-log-level.
  ##
  args:
    - --leader-elect

  ## Health probes.
  ## The manager serves the liveness (/healthz) and readiness (/readyz) endpoints on this port.
  ##
  healthProbe:
    # Health probe server port
    port: 8081

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Manager pod's affinity
  ##
  affinity: {}

  ## Prefer to spread the replicas over nodes. Ignored when affinity has a podAntiAffinity.
  ##
  antiAffinity:
    enabled: true
    topologyKey: kubernetes.io/hostname

  ## Keeps one replica during node drains.
  ##
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

  ## Deployment strategy
  ##
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%

  ## Priority class name
  ##
  # priorityClassName: ""

  ## Topology spread constraints
  ##
  # topologySpreadConstraints: []

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10

  ## Custom Deployment labels
  ##
  # labels: {}

  ## Custom Deployment annotations
  ##
  # annotations: {}

  ## Custom Pod labels and annotations
  ##
  # pod:
  #   labels: {}
  #   annotations: {}

## The datactl image. The operator uses it for restore init containers and snapshot Jobs.
## It must be built from the same release as the operator.
##
datactl:
  image:
    repository: ghcr.io/likesavabutworse/vttestserver-operator-datactl
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    # tag: ""

## RBAC configuration
##
rbac:
  ## RBAC resource scope
  ## - false (default): ClusterRole/ClusterRoleBinding (all namespaces)
  ## - true: Role/RoleBinding in each watched namespace (the release namespace if manager.watchNamespaces is empty)
  ##
  namespaced: false

  ## Helper roles for CRD management (admin/editor/viewer)
  ##
  helpers:
    ## Install convenience admin/editor/viewer roles for CRDs
    ##
    enabled: false

## ServiceAccount configuration
##
serviceAccount:
  # Install default ServiceAccount provided
  enabled: true

  ## Existing ServiceAccount name (required when enabled=false)
  ## Set to "default" to use the namespace default ServiceAccount
  ## Note: When enabled=true, respects nameOverride/fullnameOverride
  ##
  # name: ""

  ## Custom ServiceAccount annotations
  ##
  # annotations: {}

  ## Custom ServiceAccount labels
  ##
  # labels: {}

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enabled: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint
##
metrics:
  enabled: true
  # Metrics server port
  port: 8443
  # Enable secure metrics: HTTPS with certs/auth (true) or HTTP (false).
  # Note: Metrics authn/authz needs ClusterRole access.
  secure: true

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enabled: false

  ## Custom ServiceMonitor labels
  ##
  # labels: {}

  ## Custom ServiceMonitor annotations
  ##
  # annotations: {}

## Network policies for controlling traffic flow.
## Enable to restrict ingress to the controller manager.
##
networkPolicy:
  enabled: false


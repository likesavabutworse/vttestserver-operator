# A server with two keyspaces (one with two shards), a VSchema, and SQL that runs when the server is Ready.
# The VSchemas and the SQL follow the Vitess "commerce" and "customer" local example
# (vitessio/vitess, examples/common, Apache-2.0).
#
# - A keyspace with more than one shard needs a VSchema with "sharded": true, or the server fails with VSchemaMissing.
# - The VSchema ConfigMap has one key for each keyspace: <keyspace>.json.
# - Init SQL runs again after every pod start and every change of the ConfigMap, so it must be safe to repeat.
apiVersion: v1
kind: ConfigMap
metadata:
  name: commerce-vschema
data:
  commerce.json: |
    {
      "tables": {
        "customer_seq": {"type": "sequence"},
        "order_seq": {"type": "sequence"},
        "product": {}
      }
    }
  customer.json: |
    {
      "sharded": true,
      "vindexes": {
        "xxhash": {"type": "xxhash"}
      },
      "tables": {
        "customer": {
          "column_vindexes": [{"column": "customer_id", "name": "xxhash"}],
          "auto_increment": {"column": "customer_id", "sequence": "customer_seq"}
        },
        "corder": {
          "column_vindexes": [{"column": "customer_id", "name": "xxhash"}],
          "auto_increment": {"column": "order_id", "sequence": "order_seq"}
        }
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: commerce-init-sql
data:
  10-commerce.sql: |
    create table if not exists product(
      sku varchar(128),
      description varchar(128),
      price bigint,
      primary key(sku)
    ) ENGINE=InnoDB;
    create table if not exists customer_seq(id int, next_id bigint, cache bigint, primary key(id)) comment 'vitess_sequence';
    insert into customer_seq(id, next_id, cache) values(0, 1000, 100) on duplicate key update id = id;
    create table if not exists order_seq(id int, next_id bigint, cache bigint, primary key(id)) comment 'vitess_sequence';
    insert into order_seq(id, next_id, cache) values(0, 1000, 100) on duplicate key update id = id;
  20-customer.sql: |
    create table if not exists customer(
      customer_id bigint not null,
      email varchar(128),
      primary key(customer_id)
    ) ENGINE=InnoDB;
    create table if not exists corder(
      order_id bigint not null,
      customer_id bigint,
      sku varchar(128),
      price bigint,
      primary key(order_id)
    ) ENGINE=InnoDB;
---
apiVersion: vttestserver-operator.io/v1alpha1
kind: VTTestServer
metadata:
  name: sharded
spec:
  image: vitess/vttestserver:mysql84
  keyspaces:
    - {name: commerce, shards: 1}
    - {name: customer, shards: 2}
  # A setting for mysqld, written to my.cnf. Raise max_connections when you add shards.
  mysqlConfig:
    max_connections: "600"
  resources:
    requests: {cpu: 250m, memory: 1Gi}
    limits: {memory: 2Gi}
  vschema:
    configMapRef: {name: commerce-vschema}
  initSQL:
    - {keyspace: commerce, configMapKeyRef: {name: commerce-init-sql, key: 10-commerce.sql}}
    - {keyspace: customer, configMapKeyRef: {name: commerce-init-sql, key: 20-customer.sql}}

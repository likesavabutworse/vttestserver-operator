# Test credentials for the in-cluster Silo from the Tiltfile. They match rootUser and rootPassword there. The key ID is a long, unique string on purpose: Tilt hides every Secret value in its logs, and a short value would hide ordinary words.
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: vttest-dev
stringData:
  AWS_ACCESS_KEY_ID: tilt-silo-key
  AWS_SECRET_ACCESS_KEY: vttest-secret-key

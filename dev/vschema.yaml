# VSchemas for the sample servers. They follow the Vitess "commerce" and "customer" local example
apiVersion: v1
kind: ConfigMap
metadata:
  name: commerce-vschema
  namespace: vttest-dev
data:
  commerce.json: |
    {
      "tables": {
        "customer_seq": {"type": "sequence"},
        "order_seq": {"type": "sequence"},
        "product": {}
      }
    }
  customer.json: |
    {
      "sharded": true,
      "vindexes": {
        "xxhash": {"type": "xxhash"}
      },
      "tables": {
        "customer": {
          "column_vindexes": [{"column": "customer_id", "name": "xxhash"}],
          "auto_increment": {"column": "customer_id", "sequence": "customer_seq"}
        },
        "corder": {
          "column_vindexes": [{"column": "customer_id", "name": "xxhash"}],
          "auto_increment": {"column": "order_id", "sequence": "order_seq"}
        }
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: commerce-init-sql
  namespace: vttest-dev
data:
  10-commerce.sql: |
    create table if not exists product(
      sku varchar(128),
      description varchar(128),
      price bigint,
      primary key(sku)
    ) ENGINE=InnoDB;
    create table if not exists customer_seq(id int, next_id bigint, cache bigint, primary key(id)) comment 'vitess_sequence';
    insert into customer_seq(id, next_id, cache) values(0, 1000, 100) on duplicate key update id = id;
    create table if not exists order_seq(id int, next_id bigint, cache bigint, primary key(id)) comment 'vitess_sequence';
    insert into order_seq(id, next_id, cache) values(0, 1000, 100) on duplicate key update id = id;
  20-customer.sql: |
    create table if not exists customer(
      customer_id bigint not null,
      email varchar(128),
      primary key(customer_id)
    ) ENGINE=InnoDB;
    create table if not exists corder(
      order_id bigint not null,
      customer_id bigint,
      sku varchar(128),
      price bigint,
      primary key(order_id)
    ) ENGINE=InnoDB;
